name: Build Cocos Creator 3.4.0 Web Client

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cocos-web-build-${{ github.ref_name }}
  cancel-in-progress: true

env:
  COCOS_VERSION: "3.4.0"
  COCOS_DOWNLOAD_URL: "https://download.cocos.com/CocosCreator/v3.4.0/CocosCreator-v3.4.0-win32-121822.zip"
  COCOS_INSTALL_DIR: "C:\\CocosCreator-3.4.0"
  WEB_OUTPUT_PATH: "build/web-desktop"
  # main luôn xuất bản production; mọi nhánh khác chỉ xuất bản preview.
  DEPLOY_BRANCH: ${{ github.ref_name == 'main' && 'build-web' || 'build-web-preview' }}

jobs:
  build-web:
    name: Build and publish Web Desktop
    runs-on: windows-2022
    timeout-minutes: 120

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Show deployment target
        shell: pwsh
        run: |
          Write-Host "Source branch: $env:GITHUB_REF_NAME"
          Write-Host "Deployment branch: $env:DEPLOY_BRANCH"
          if ($env:GITHUB_REF_NAME -ne "main" -and $env:DEPLOY_BRANCH -eq "build-web") {
            throw "Safety check failed: a non-main branch must never publish to build-web."
          }

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Validate project version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $project = Get-Content "package.json" -Raw | ConvertFrom-Json
          $actualVersion = [string]$project.creator.version
          if ($actualVersion -ne $env:COCOS_VERSION) { throw "Project requires Cocos Creator $actualVersion, but workflow is configured for $env:COCOS_VERSION." }
          Write-Host "Confirmed Cocos Creator version: $actualVersion"

      - name: Cache Cocos Creator 3.4.0
        id: cache-cocos
        uses: actions/cache@v4
        with:
          path: ${{ env.COCOS_INSTALL_DIR }}
          key: cocos-creator-${{ runner.os }}-${{ env.COCOS_VERSION }}-121822

      - name: Download official Cocos Creator 3.4.0
        if: steps.cache-cocos.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $env:RUNNER_TEMP "CocosCreator-v3.4.0-win32.zip"
          if (Test-Path $env:COCOS_INSTALL_DIR) { Remove-Item $env:COCOS_INSTALL_DIR -Recurse -Force }
          New-Item -ItemType Directory -Path $env:COCOS_INSTALL_DIR -Force | Out-Null
          & curl.exe --fail --location --retry 5 --retry-delay 10 --output $archive $env:COCOS_DOWNLOAD_URL
          if ($LASTEXITCODE -ne 0) { throw "Failed to download Cocos Creator. curl exit code: $LASTEXITCODE" }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:COCOS_INSTALL_DIR -Force

      - name: Locate Cocos Creator executable
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $creator = Get-ChildItem -Path $env:COCOS_INSTALL_DIR -Filter "CocosCreator.exe" -File -Recurse | Select-Object -First 1
          if (-not $creator) { throw "CocosCreator.exe was not found in the official archive." }
          "COCOS_EXE=$($creator.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run repository checks
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          node --check scripts/prepare-vercel.mjs
          node --check scripts/test-pwa-build.mjs
          npm run test:pwa

      - name: Build Cocos Web Desktop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = Join-Path $env:GITHUB_WORKSPACE $env:WEB_OUTPUT_PATH
          if (Test-Path $output) { Remove-Item $output -Recurse -Force }
          $buildOptions = @("platform=web-desktop","buildPath=project://build","outputName=web-desktop","startScene=94681aa6-17dd-47fe-b1bd-f2e2ca8fd6ca","debug=false","md5Cache=true") -join ";"
          $arguments = @("--project",$env:GITHUB_WORKSPACE,"--build",$buildOptions)
          Write-Host "Starting Cocos Creator $env:COCOS_VERSION build and waiting for completion..."
          $process = Start-Process -FilePath $env:COCOS_EXE -ArgumentList $arguments -Wait -PassThru -NoNewWindow
          $creatorExitCode = $process.ExitCode
          if ($creatorExitCode -notin @(0, 36)) { throw "Cocos Creator build failed with exit code $creatorExitCode." }

      - name: Validate Web Desktop output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = Join-Path $env:GITHUB_WORKSPACE $env:WEB_OUTPUT_PATH
          $index = Join-Path $output "index.html"
          if (-not (Test-Path $index -PathType Leaf)) { throw "Cocos Creator completed without producing $index." }
          $size = (Get-ChildItem $output -File -Recurse | Measure-Object -Property Length -Sum).Sum
          Write-Host ("Output size: {0:N2} MB" -f ($size / 1MB))

      - name: Optimize generated build for mobile
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $output = Join-Path $env:GITHUB_WORKSPACE $env:WEB_OUTPUT_PATH
          $indexPath = Join-Path $output "index.html"
          $html = Get-Content $indexPath -Raw
          $html = $html -replace '<meta name="viewport"[^>]*>', '<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>'
          $html = $html -replace '<meta name="screen-orientation" content="portrait"/>', '<meta name="screen-orientation" content="landscape"/>'
          $html = $html -replace '(?s)\s*<h1 class="header">.*?</h1>', ''
          $html = $html -replace '(?s)\s*<p class="footer">.*?</p>', ''
          $html = $html -replace '<div id="GameDiv" style="width: 1280px; height: 960px;">', '<div id="GameDiv">'
          $html = $html -replace '<canvas id="GameCanvas" width="1280" height="960"></canvas>', '<canvas id="GameCanvas" width="1280" height="960" tabindex="0"></canvas>'
          $mobileStyle = @'
          <style id="mobile-web-shell">
          html,body{margin:0!important;padding:0!important;width:100%!important;height:100%!important;overflow:hidden!important;background:#000!important;position:fixed!important;inset:0!important;touch-action:none;-webkit-user-select:none;user-select:none}
          #GameDiv{position:fixed!important;inset:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)!important;width:auto!important;height:auto!important;margin:0!important;border:0!important;border-radius:0!important;box-shadow:none!important;background:#000!important;overflow:hidden!important}
          #Cocos3dGameContainer{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;margin:0!important;overflow:hidden!important}
          #GameCanvas{display:block!important;width:100%!important;height:100%!important;max-width:100%!important;max-height:100%!important;margin:0!important;object-fit:contain!important;touch-action:none!important;background:#000!important}
          .header,.footer{display:none!important}
          #rotateHint{display:none;position:fixed;z-index:999999;inset:0;background:#07111f;color:#fff8df;align-items:center;justify-content:center;text-align:center;padding:28px;font:700 20px/1.5 Arial,sans-serif;box-sizing:border-box}
          @media (orientation:portrait) and (max-width:900px){#rotateHint{display:flex}}
          </style>
          '@
          $html = $html -replace '</head>', "$mobileStyle`n</head>"
          $rotate = '<div id="rotateHint">Vui lòng xoay ngang điện thoại để chơi game.</div>'
          $html = $html -replace '<body>', "<body>`n    $rotate"
          Set-Content -Path $indexPath -Value $html -Encoding utf8
          Write-Host "Mobile fullscreen shell applied."

      - name: Prepare deployment branch contents
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $deployDir = Join-Path $env:RUNNER_TEMP "slgclient-deploy"
          if (Test-Path $deployDir) { Remove-Item $deployDir -Recurse -Force }
          New-Item -ItemType Directory -Path $deployDir -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $deployDir "build") -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $deployDir "scripts") -Force | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE $env:WEB_OUTPUT_PATH) -Destination (Join-Path $deployDir "build/web-desktop") -Recurse -Force
          Copy-Item "package.json" (Join-Path $deployDir "package.json") -Force
          Copy-Item "vercel.json" (Join-Path $deployDir "vercel.json") -Force
          Copy-Item "scripts/prepare-vercel.mjs" (Join-Path $deployDir "scripts/prepare-vercel.mjs") -Force
          New-Item -ItemType File -Path (Join-Path $deployDir ".nojekyll") -Force | Out-Null
          @("# Generated deployment branch","","Generated automatically from $env:GITHUB_REF_NAME by GitHub Actions.","Target branch: $env:DEPLOY_BRANCH","Do not edit this branch manually.") | Set-Content -Path (Join-Path $deployDir "README.md") -Encoding utf8

      - name: Push deployment branch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $deployDir = Join-Path $env:RUNNER_TEMP "slgclient-deploy"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan $env:DEPLOY_BRANCH
          Get-ChildItem $env:GITHUB_WORKSPACE -Force | Where-Object { $_.Name -ne ".git" } | Remove-Item -Recurse -Force
          Copy-Item -Path (Join-Path $deployDir "*") -Destination $env:GITHUB_WORKSPACE -Recurse -Force
          Copy-Item -Path (Join-Path $deployDir ".nojekyll") -Destination (Join-Path $env:GITHUB_WORKSPACE ".nojekyll") -Force
          git add --all
          git commit -m "build(web): $env:GITHUB_SHA" -m "Generated automatically with Cocos Creator $env:COCOS_VERSION from $env:GITHUB_REF_NAME."
          git push --force origin "HEAD:$env:DEPLOY_BRANCH"
          Write-Host "Published Web Desktop to branch $env:DEPLOY_BRANCH."
