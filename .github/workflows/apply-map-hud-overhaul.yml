name: Apply map HUD overhaul once

on:
  push:
    branches:
      - feat/modern-vietnamese-ui-overhaul
    paths:
      - .github/workflows/apply-map-hud-overhaul.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/modern-vietnamese-ui-overhaul
          fetch-depth: 0
          persist-credentials: true

      - name: Restyle real MapUIScene controls without changing handlers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          const fs = require('fs');
          const path = 'assets/scenes/MapUIScene.prefab';
          const data = JSON.parse(fs.readFileSync(path, 'utf8'));

          const COLORS = {
            gold: { __type__: 'cc.Color', r: 231, g: 190, b: 109, a: 255 },
            text: { __type__: 'cc.Color', r: 239, g: 225, b: 198, a: 255 },
            panel: { __type__: 'cc.Color', r: 29, g: 23, b: 18, a: 245 },
            panel2: { __type__: 'cc.Color', r: 43, g: 32, b: 23, a: 245 },
            red: { __type__: 'cc.Color', r: 118, g: 45, b: 37, a: 255 },
          };

          const VI = [
            ['昵称:', 'Chúa công:'], ['昵称：', 'Chúa công:'], ['昵称', 'Chúa công'],
            ['武将', 'Tướng'], ['将领', 'Tướng'], ['战报', 'Chiến báo'], ['招募', 'Chiêu mộ'], ['抽卡', 'Chiêu mộ'],
            ['联盟', 'Liên minh'], ['聊天', 'Trò chuyện'], ['技能', 'Kỹ năng'], ['设置', 'Cài đặt'],
            ['征收', 'Thu thuế'], ['税收', 'Thu thuế'], ['转换', 'Chuyển đổi'], ['返回', 'Quay lại'],
            ['退出', 'Đăng xuất'], ['市场', 'Chợ'], ['队伍', 'Đội hình'], ['建筑', 'Công trình'],
            ['标签', 'Dấu'], ['跳转', 'Đi đến'], ['木材', 'Gỗ'], ['铁矿', 'Sắt'], ['石料', 'Đá'], ['粮食', 'Lương'],
            ['黄金', 'Vàng'], ['金币', 'Vàng'], ['政令', 'Lệnh'], ['坐标', 'Tọa độ'],
            ['世界', 'Thế giới'], ['主城', 'Thành chính'], ['玩家', 'Người chơi'], ['角色', 'Nhân vật'],
            ['确定', 'Xác nhận'], ['取消', 'Hủy'], ['关闭', 'Đóng'], ['详情', 'Chi tiết'],
          ];

          function tr(value) {
            if (typeof value !== 'string') return value;
            let out = value;
            for (const [a, b] of VI) out = out.split(a).join(b);
            return out;
          }

          const nodeById = new Map();
          data.forEach((e, i) => { if (e && e.__type__ === 'cc.Node') nodeById.set(i, e); });
          const nodeName = (id) => nodeById.get(id)?._name || '';
          const componentRefs = (nodeId) => nodeById.get(nodeId)?._components || [];
          const components = (nodeId) => componentRefs(nodeId).map(r => data[r.__id__]).filter(Boolean);
          const nodeChildren = (nodeId) => nodeById.get(nodeId)?._children?.map(r => r.__id__) || [];

          function descendants(nodeId, out = []) {
            for (const id of nodeChildren(nodeId)) {
              out.push(id);
              descendants(id, out);
            }
            return out;
          }

          function setPos(nodeId, x, y) {
            const n = nodeById.get(nodeId);
            if (!n || !n._lpos) return;
            n._lpos.x = x;
            n._lpos.y = y;
          }

          function setSize(nodeId, w, h) {
            for (const c of components(nodeId)) {
              if (c.__type__ === 'cc.UITransform' && c._contentSize) {
                c._contentSize.width = w;
                c._contentSize.height = h;
              }
            }
          }

          function tintSprites(nodeId, color, deep = true) {
            const ids = deep ? [nodeId, ...descendants(nodeId)] : [nodeId];
            for (const id of ids) {
              const name = nodeName(id).toLowerCase();
              for (const c of components(id)) {
                if (c.__type__ !== 'cc.Sprite') continue;
                const chrome = id === nodeId || /background|(^|_)bg|diban|panel|frame|kuang|button|btn|team_item/.test(name);
                const art = /general|hero|head|avatar|portrait|skill|icon|map|army|city|build|respic|pic/.test(name);
                if (chrome && !art) c._color = { ...color };
              }
            }
          }

          function labelsUnder(nodeId) {
            const ids = [nodeId, ...descendants(nodeId)];
            const result = [];
            for (const id of ids) {
              for (const c of components(id)) if (c.__type__ === 'cc.Label') result.push(c);
            }
            return result;
          }

          function styleLabel(label, text = null, size = null, title = false) {
            label._string = text !== null ? text : tr(label._string || '');
            label._font = null;
            label._isSystemFontUsed = true;
            label._fontFamily = title ? 'Times New Roman' : 'Arial';
            label._color = title ? { ...COLORS.gold } : { ...COLORS.text };
            label._enableWrapText = false;
            if (size) {
              label._fontSize = size;
              label._actualFontSize = size;
              label._lineHeight = Math.ceil(size * 1.2);
            }
          }

          function eventRefs(button) {
            const refs = Array.isArray(button.clickEvents) ? button.clickEvents : (Array.isArray(button._clickEvents) ? button._clickEvents : []);
            return refs.map(r => data[r.__id__]).filter(e => e?.__type__ === 'cc.ClickEvent');
          }

          data.forEach((e) => {
            if (!e || typeof e !== 'object') return;
            if (e.__type__ === 'cc.Label') styleLabel(e);
            if (e.__type__ === 'cc.EditBox') {
              if (typeof e._placeholder === 'string') e._placeholder = tr(e._placeholder);
              if (typeof e.placeholder === 'string') e.placeholder = tr(e.placeholder);
            }
          });

          // Top brass/charcoal bar.
          for (const [id, n] of nodeById) {
            const ui = components(id).find(c => c.__type__ === 'cc.UITransform');
            if (ui?._contentSize && ui._contentSize.width >= 1200 && ui._contentSize.height >= 70 && ui._contentSize.height <= 110 && n._lpos?.y > 260) {
              tintSprites(id, COLORS.panel, false);
              setSize(id, 1280, 86);
            }
          }

          // Resource strip remains connected to LoginCommand data through MapUILogic.
          let resourceRoot = -1;
          for (const [id, n] of nodeById) {
            const hasLayout = components(id).some(c => c.__type__ === 'cc.Layout');
            if (hasLayout && nodeChildren(id).length >= 8 && (n._lpos?.y || 0) > 250) {
              resourceRoot = id;
              setPos(id, 35, 316);
              for (const childId of nodeChildren(id)) {
                tintSprites(childId, COLORS.panel2, true);
                for (const label of labelsUnder(childId)) {
                  styleLabel(label, label._string === 'Label' ? '—' : null, 17, false);
                  label._color = { ...COLORS.text };
                }
              }
              break;
            }
          }

          const menu = new Map([
            ['onClickGeneral', { text: 'Tướng', order: 0 }],
            ['openWarReport', { text: 'Chiến báo', order: 1 }],
            ['openDraw', { text: 'Chiêu mộ', order: 2 }],
            ['openUnion', { text: 'Liên minh', order: 3 }],
            ['openChat', { text: 'Trò chuyện', order: 4 }],
            ['onClickCollection', { text: 'Thu thuế', order: 5 }],
            ['onClickSkillBtn', { text: 'Kỹ năng', order: 6 }],
            ['onClickSetting', { text: 'Cài đặt', order: 7 }],
          ]);
          const secondary = new Map([
            ['openTr', 'Chuyển đổi'],
            ['onOpenGeneralConvert', 'Chuyển tướng'],
            ['onOpenGeneralRoster', 'Đội hình'],
          ]);
          const foundHandlers = new Set();
          const handlerInventory = [];
          let realButtonCount = 0;

          data.forEach((entry) => {
            if (!entry || entry.__type__ !== 'cc.Button' || !entry.node || !Number.isInteger(entry.node.__id__)) return;
            realButtonCount++;
            const nodeId = entry.node.__id__;
            const handlers = eventRefs(entry).map(e => e.handler).filter(Boolean);
            handlerInventory.push(...handlers);

            tintSprites(nodeId, COLORS.panel2, true);
            for (const label of labelsUnder(nodeId)) {
              styleLabel(label, null, 17, false);
              label._color = { ...COLORS.text };
            }

            const known = handlers.map(h => [h, menu.get(h)]).find(([, cfg]) => cfg);
            if (known) {
              const [handler, cfg] = known;
              foundHandlers.add(handler);
              setPos(nodeId, -560, 188 - cfg.order * 55);
              setSize(nodeId, 132, 46);
              const labels = labelsUnder(nodeId);
              if (labels.length) {
                styleLabel(labels[0], cfg.text, 18, false);
                labels[0]._isBold = true;
                labels[0]._color = { ...COLORS.gold };
              }
              return;
            }

            const extra = handlers.map(h => [h, secondary.get(h)]).find(([, text]) => text);
            if (extra) {
              const [handler, text] = extra;
              foundHandlers.add(handler);
              const labels = labelsUnder(nodeId);
              if (labels.length) styleLabel(labels[0], text, 16, false);
            }
          });

          // Keep the real logout/back action compact at top-left.
          data.forEach((entry) => {
            if (!entry || entry.__type__ !== 'cc.Button' || !entry.node) return;
            const nodeId = entry.node.__id__;
            if (eventRefs(entry).some(e => e.handler === 'onBack')) {
              foundHandlers.add('onBack');
              setPos(nodeId, -592, 320);
              setSize(nodeId, 72, 48);
              tintSprites(nodeId, COLORS.red, true);
              const labels = labelsUnder(nodeId);
              if (labels.length) styleLabel(labels[0], 'Thoát', 15, false);
            }
          });

          // Profile labels reference live role data, never sample values.
          for (const entry of data) {
            if (!entry || typeof entry !== 'object' || !entry.nameLabel || !entry.ridLabel) continue;
            for (const key of ['nameLabel', 'ridLabel']) {
              const ref = entry[key];
              if (!ref || !Number.isInteger(ref.__id__)) continue;
              const label = data[ref.__id__];
              if (label?.__type__ !== 'cc.Label' || !label.node) continue;
              styleLabel(label, null, key === 'nameLabel' ? 18 : 14, key === 'nameLabel');
              setPos(label.node.__id__, -475, key === 'nameLabel' ? 332 : 306);
            }
          }

          // Retint old decorative chrome only; preserve map, generals, armies and building art.
          for (const [id, n] of nodeById) {
            const name = (n._name || '').toLowerCase();
            const art = /general|hero|head|avatar|portrait|skill|icon|map|army|city|build|cloud|pic/.test(name);
            const chrome = /diban|panel|frame|kuang|background|(^|_)bg($|_)/.test(name);
            if (chrome && !art) tintSprites(id, COLORS.panel2, false);
          }

          if (!realButtonCount) throw new Error('Không tìm thấy Button thật trong MapUIScene.prefab.');
          if (resourceRoot < 0) throw new Error('Không xác định được resource strip thật của MapUIScene.prefab.');
          if (!handlerInventory.length) throw new Error('Không đọc được ClickEvent handler thật của MapUIScene.prefab.');

          console.log('Real buttons:', realButtonCount);
          console.log('Real handler inventory:', [...new Set(handlerInventory)].join(', '));
          console.log('Styled handlers:', [...foundHandlers].join(', '));

          const cjkLabels = data.filter(e => e?.__type__ === 'cc.Label').map(e => e._string || '').filter(s => /[\u3400-\u9fff]/.test(s));
          if (cjkLabels.length) throw new Error(`Map HUD vẫn còn chữ Trung hiển thị: ${[...new Set(cjkLabels)].join(' | ')}`);

          fs.writeFileSync(path, JSON.stringify(data, null, 2) + '\n', 'utf8');
          '@ | Set-Content -Path "$env:RUNNER_TEMP/apply-map-hud.cjs" -Encoding utf8
          node "$env:RUNNER_TEMP/apply-map-hud.cjs"

      - name: Verify gameplay wiring did not change
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --exit-code HEAD -- assets/scripts/map assets/scripts/general assets/scripts/login assets/scripts/network
          $diff = git diff -- assets/scenes/MapUIScene.prefab
          if ($diff -match '"handler"|"_componentId"|"customEventData"') {
            throw 'Map HUD migration changed serialized click-event wiring.'
          }

      - name: Commit MapUIScene prefab only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scenes/MapUIScene.prefab
          if (git diff --cached --quiet) { throw 'Map HUD migration produced no prefab changes.' }
          git commit -m "feat(ui): rebuild map HUD with real Vietnamese controls"
          git push origin HEAD:feat/modern-vietnamese-ui-overhaul
