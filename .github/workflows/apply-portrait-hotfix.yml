name: Áp dụng hotfix giao diện mobile

on:
  push:
    branches:
      - agent/web-client-foundation
    paths:
      - '.agent/portrait-hotfix.tar.gz'
      - '.github/workflows/apply-portrait-hotfix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          ref: agent/web-client-foundation
          fetch-depth: 0

      - name: Xác minh và giải nén hotfix
        run: |
          echo "0d12495b7a6c9cbbd7b4e37547b41b382be56248dc6ca721a27c2fd77875d3f2  .agent/portrait-hotfix.tar.gz" | sha256sum -c -
          tar -xzf .agent/portrait-hotfix.tar.gz
          rm -f .agent/portrait-hotfix.tar.gz
          rmdir .agent 2>/dev/null || true
          rm -f .github/workflows/apply-portrait-hotfix.yml

      - name: Ghi mã nguồn sạch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "Không có thay đổi để ghi"; exit 1; }
          git commit -m "fix: đối chiếu Cocos và sửa giao diện bản đồ mobile"
          git push origin HEAD:agent/web-client-foundation
