name: Fix UI imports once

on:
  push:
    branches:
      - feat/modern-vietnamese-ui-overhaul
    paths:
      - scripts/fix-ui-imports.mjs

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/modern-vietnamese-ui-overhaul
          fetch-depth: 0

      - name: Rewrite UI helper imports
        run: node scripts/fix-ui-imports.mjs

      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No import changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scripts
          git commit -m "fix(build): route UI helpers through stable core module"
          git push origin HEAD:feat/modern-vietnamese-ui-overhaul
