name: Fix inline UI imports once

on:
  push:
    branches:
      - feat/modern-vietnamese-ui-overhaul
    paths:
      - scripts/fix-inline-helper-imports.mjs

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/modern-vietnamese-ui-overhaul
          fetch-depth: 0

      - name: Remove leftover shared UI helper imports
        run: node scripts/fix-inline-helper-imports.mjs

      - name: Verify controller-local helpers
        shell: bash
        run: |
          node scripts/fix-inline-helper-imports.mjs --check
          if grep -R -n "ANCIENT_UI" assets/scripts/common/AudioManager.ts assets/scripts/i18n/I18n.ts; then
            echo "UI helper definitions must not remain in shared core modules"
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No import cleanup needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scripts
          git commit -m "fix(build): remove leftover shared UI helper imports"
          git push origin HEAD:feat/modern-vietnamese-ui-overhaul
