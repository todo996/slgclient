name: Tự động build Vercel Preview

on:
  push:
    branches:
      - feat/modern-vietnamese-ui-overhaul
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-cocos-build:
    name: Kích hoạt Cocos Web Preview
    runs-on: ubuntu-latest
    steps:
      - name: Gọi workflow Cocos build trên đúng nhánh hiện tại
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Source branch: ${GITHUB_REF_NAME}"
          echo "Dispatching cocos-build.yml..."
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/cocos-build.yml/dispatches" \
            --data "{\"ref\":\"${GITHUB_REF_NAME}\"}"
          echo "Đã yêu cầu build Cocos cho ${GITHUB_REF_NAME}."
