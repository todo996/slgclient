name: Capture rebuilt UI preview

on:
  push:
    branches:
      - feat/modern-vietnamese-ui-overhaul
    paths:
      - .github/workflows/capture-ui-preview.yml

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout generated preview build
        uses: actions/checkout@v4
        with:
          ref: build-web-preview
          path: preview
          fetch-depth: 1

      - name: Start local preview server
        shell: bash
        run: |
          cd preview/build/web-desktop
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/slg-preview-server.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/slg-preview-server.log
          exit 1

      - name: Capture 1536x864 after game finishes loading
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome/Chromium not present on runner" >&2
            exit 1
          fi
          mkdir -p screenshots
          "$CHROME" \
            --headless=new \
            --no-sandbox \
            --disable-gpu \
            --hide-scrollbars \
            --window-size=1536,864 \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/slg-chrome \
            http://127.0.0.1:4173/ > /tmp/slg-chrome.log 2>&1 &

          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:9222/json >/dev/null; then break; fi
            sleep 1
          done
          # Cocos splash/loading needs real wall-clock time; virtual-time screenshots can freeze on splash.
          sleep 30

          cat > /tmp/capture-cdp.mjs <<'NODE'
          const targets = await fetch('http://127.0.0.1:9222/json').then(r => r.json());
          const page = targets.find(t => t.type === 'page' && t.url.includes('127.0.0.1:4173')) || targets.find(t => t.type === 'page');
          if (!page) throw new Error('No Chrome page target found');
          const ws = new WebSocket(page.webSocketDebuggerUrl);
          let seq = 0;
          const pending = new Map();
          ws.onmessage = ev => {
            const msg = JSON.parse(ev.data);
            if (msg.id && pending.has(msg.id)) {
              const {resolve, reject} = pending.get(msg.id);
              pending.delete(msg.id);
              msg.error ? reject(new Error(JSON.stringify(msg.error))) : resolve(msg.result);
            }
          };
          await new Promise((resolve, reject) => { ws.onopen = resolve; ws.onerror = reject; });
          const send = (method, params={}) => new Promise((resolve, reject) => {
            const id = ++seq; pending.set(id, {resolve, reject}); ws.send(JSON.stringify({id, method, params}));
          });
          await send('Page.enable');
          await send('Emulation.setDeviceMetricsOverride', {width:1536,height:864,deviceScaleFactor:1,mobile:false});
          const state = await send('Runtime.evaluate', {expression:`JSON.stringify({ready:document.readyState,title:document.title,canvas:!!document.querySelector('canvas'),body:(document.body?.innerText||'').slice(0,500)})`, returnByValue:true});
          console.log('PAGE_STATE=' + state.result.value);
          const shot = await send('Page.captureScreenshot', {format:'png', captureBeyondViewport:false});
          await import('node:fs').then(fs => fs.writeFileSync('screenshots/runtime-1536x864.png', Buffer.from(shot.data,'base64')));
          ws.close();
          NODE
          node /tmp/capture-cdp.mjs | tee screenshots/page-state.txt
          test -s screenshots/runtime-1536x864.png
          cp /tmp/slg-chrome.log screenshots/chrome.log || true

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: ui-preview-runtime-loaded
          path: screenshots/
          if-no-files-found: error
          retention-days: 2
