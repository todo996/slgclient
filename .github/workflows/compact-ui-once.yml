name: Compact UI once

on:
  push:
    branches:
      - feat/modern-vietnamese-ui-overhaul
    paths:
      - scripts/compact-ui.mjs

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/modern-vietnamese-ui-overhaul
          fetch-depth: 0
      - name: Compact redesigned controllers
        run: node scripts/compact-ui.mjs
      - name: Verify compact source
        shell: bash
        run: |
          grep -n "protected onLoad" assets/scripts/Main.ts
          if grep -R -n "__SLG_ANCIENT_UI__\|LOCAL_UI_TRANSLATIONS\|i18n/I18n" assets/scripts/map/ui/DrawLogic.ts assets/scripts/map/ui/WarReportLogic.ts assets/scripts/chat/ChatLogic.ts assets/scripts/union/UnionLogic.ts; then
            echo "Old UI bridge residue remains"
            exit 1
          fi
      - name: Commit compact UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scripts
          git commit -m "fix(build): compact redesigned UI inside stable controllers"
          git push origin HEAD:feat/modern-vietnamese-ui-overhaul
