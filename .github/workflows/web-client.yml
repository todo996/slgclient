name: Web Client CI

on:
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/web-client.yml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "web/**"
      - ".github/workflows/web-client.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Typecheck and build
        run: npm run build
