name: Kiểm tra client, PWA và Việt hoá

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Cài TypeScript dùng cho kiểm tra cú pháp
        run: npm install --no-save --no-package-lock typescript@5.2.2

      - name: Kiểm tra cấu hình Vercel và PWA
        run: |
          node --check scripts/prepare-vercel.mjs
          node --check scripts/test-pwa-build.mjs
          npm run test:pwa

      - name: Kiểm tra công cụ Việt hoá
        run: node --check scripts/audit-vietnamese.mjs

      - name: Kiểm tra cú pháp TypeScript
        run: node scripts/check-typescript-syntax.mjs

      - name: Quét chuỗi chưa Việt hoá
        env:
          FAIL_ON_UNMAPPED_UI: 'true'
          FAIL_ON_UNMAPPED_ALL: 'true'
        run: node scripts/audit-vietnamese.mjs

      - name: Lưu báo cáo Việt hoá
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vietnamese-audit
          path: artifacts/vietnamese-audit.json
          retention-days: 7
