name: Apply Web 60 Source

on:
  push:
    branches:
      - agent/web-client-foundation
    paths:
      - ".github/source-bundles/web-60/**"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/web-client-foundation
          fetch-depth: 0

      - name: Verify and extract source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/source-bundles/web-60/part-00 \
            .github/source-bundles/web-60/part-01 \
            .github/source-bundles/web-60/tail-00 \
            .github/source-bundles/web-60/tail-01 \
            .github/source-bundles/web-60/tail-02 \
            .github/source-bundles/web-60/tail-03 \
            .github/source-bundles/web-60/tail-04 \
            .github/source-bundles/web-60/tail-05-00 \
            .github/source-bundles/web-60/tail-05-01 \
            .github/source-bundles/web-60/tail-05-02 \
            | base64 --decode > /tmp/web-60-source.tar.gz
          echo "a3df9f70d82bc9cda2183f04ee07338e8709f71e32c156b04afc7b06ace7ea06  /tmp/web-60-source.tar.gz" | sha256sum --check -
          tar -xzf /tmp/web-60-source.tar.gz
          rm -rf .github/source-bundles/web-60
          rm -f .github/workflows/apply-web-60-source.yml

      - name: Commit extracted source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Port general, skill, army and war report systems"
          git push origin HEAD:agent/web-client-foundation
