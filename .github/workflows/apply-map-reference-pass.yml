name: Apply reference Map HUD pass

on:
  push:
    branches:
      - feat/modern-vietnamese-ui-overhaul
    paths:
      - .github/workflows/apply-map-reference-pass.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/modern-vietnamese-ui-overhaul
          fetch-depth: 0
      - name: Apply Map HUD source migration
        run: python3 .github/scripts/apply_map_reference_pass.py
      - name: Commit Map HUD
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/scripts/map/ui/MapUILogic.ts
          git commit -m "feat(ui): rebuild map HUD closer to reference layout"
          git push origin HEAD:feat/modern-vietnamese-ui-overhaul
