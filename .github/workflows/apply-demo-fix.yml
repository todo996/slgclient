name: Apply demo map fix

on:
  push:
    branches:
      - agent/web-client-foundation
    paths:
      - ".agent/demo-fix/**"
      - ".github/workflows/apply-demo-fix.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply source bundle
        run: |
          cat .agent/demo-fix/part-* > /tmp/demo-fix.tgz
          echo "55b04c3d5a3a0baf205fc7a73dd9379c4eb70fd5cffaf97dcfaa725545248a62  /tmp/demo-fix.tgz" | sha256sum -c -
          tar -xzf /tmp/demo-fix.tgz
          rm -rf .agent/demo-fix
          rm -f .github/workflows/apply-demo-fix.yml

      - name: Commit clean source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix isometric tile gaps and add offline demo mode"
          git push origin HEAD:agent/web-client-foundation
