name: Capture real Cocos runtime UI

on:
  push:
    branches:
      - feat/modern-vietnamese-ui-overhaul
    paths:
      - .github/workflows/runtime-ui-capture.yml

permissions:
  contents: read

jobs:
  capture-real-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout generated Cocos Web Desktop build
        uses: actions/checkout@v4
        with:
          ref: build-web-preview
          path: preview
          fetch-depth: 1

      - name: Checkout source for UI coordinate inspection
        uses: actions/checkout@v4
        with:
          ref: feat/modern-vietnamese-ui-overhaul
          path: source
          fetch-depth: 1

      - name: Locate build and create-role button
        shell: bash
        run: |
          set -euo pipefail
          INDEX="$(find preview -type f -name index.html | head -n 1)"
          test -n "$INDEX"
          echo "BUILD_DIR=$(dirname "$INDEX")" >> "$GITHUB_ENV"
          node <<'NODE' | tee /tmp/create-coordinate.txt
          const fs=require('fs');
          const data=JSON.parse(fs.readFileSync('source/assets/prefab/create.prefab','utf8'));
          const ref=v=>v&&typeof v==='object'&&Number.isInteger(v.__id__)?data[v.__id__]:null;
          let target=null;
          for(const o of data){
            if(!o||o.__type__!=='cc.Button'||!Array.isArray(o.clickEvents)) continue;
            if(o.clickEvents.some(e=>ref(e)?.handler==='onClickCreate')) { target=ref(o.node); break; }
          }
          let x=0,y=0,cur=target,guard=0;
          while(cur&&guard++<30){if(cur._lpos){x+=Number(cur._lpos.x||0);y+=Number(cur._lpos.y||0);}cur=ref(cur._parent);}
          const out={x:Math.round(640+x),y:Math.round(360-y)};
          console.log(`CREATE_NODE=${target?target._name:'fallback'} COCOS=(${x},${y}) SCREEN=(${out.x},${out.y})`);
          fs.writeFileSync('/tmp/create-screen.json',JSON.stringify(out));
          NODE

      - name: Start real generated build
        shell: bash
        run: |
          set -euo pipefail
          cd "$BUILD_DIR"
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/slg-http.log 2>&1 &
          for i in {1..40}; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/slg-http.log
          exit 1

      - name: Register login and capture five real screens
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          mkdir -p screenshots
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --window-size=1280,720 --remote-debugging-port=9222 \
            --user-data-dir=/tmp/slg-runtime-profile about:blank >/tmp/slg-chrome.log 2>&1 &
          for i in {1..40}; do curl -fsS http://127.0.0.1:9222/json >/dev/null && break; sleep 1; done

          cat >/tmp/runtime-capture.mjs <<'NODE'
          import fs from 'node:fs';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          const targets=await fetch('http://127.0.0.1:9222/json').then(r=>r.json());
          const page=targets.find(t=>t.type==='page');
          if(!page) throw new Error('No Chrome page target');
          const ws=new WebSocket(page.webSocketDebuggerUrl);
          let seq=0; const pending=new Map(); const events=[];
          ws.onmessage=ev=>{
            const m=JSON.parse(ev.data);
            if(m.id&&pending.has(m.id)){const p=pending.get(m.id);pending.delete(m.id);m.error?p.reject(new Error(JSON.stringify(m.error))):p.resolve(m.result);return;}
            if(m.method==='Runtime.consoleAPICalled') events.push('console '+JSON.stringify(m.params.args?.map(a=>a.value??a.description)));
            if(m.method==='Runtime.exceptionThrown') events.push('exception '+JSON.stringify(m.params.exceptionDetails));
            if(m.method==='Network.loadingFailed') events.push('network-failed '+JSON.stringify({url:m.params?.requestId,error:m.params?.errorText,type:m.params?.type}));
            if(m.method==='Network.webSocketCreated') events.push('websocket '+String(m.params?.url||''));
          };
          await new Promise((resolve,reject)=>{ws.onopen=resolve;ws.onerror=reject;});
          const send=(method,params={})=>new Promise((resolve,reject)=>{const id=++seq;pending.set(id,{resolve,reject});ws.send(JSON.stringify({id,method,params}));});
          await send('Page.enable'); await send('Runtime.enable'); await send('Network.enable');
          await send('Emulation.setDeviceMetricsOverride',{width:1280,height:720,deviceScaleFactor:1,mobile:false});
          await send('Page.addScriptToEvaluateOnNewDocument',{source:`window.__TAM_QUOC_CONFIG__={serverUrl:'wss://slgserver-production.up.railway.app',webUrl:'https://slgserver-production.up.railway.app',locale:'vi-VN'};`});
          await send('Page.navigate',{url:'http://127.0.0.1:4173/'}); await sleep(26000);

          const shot=async n=>{const s=await send('Page.captureScreenshot',{format:'png',captureBeyondViewport:false});fs.writeFileSync(`screenshots/${n}.png`,Buffer.from(s.data,'base64'));console.log('captured',n);};
          const click=async(x,y)=>{await send('Input.dispatchMouseEvent',{type:'mouseMoved',x,y});await send('Input.dispatchMouseEvent',{type:'mousePressed',x,y,button:'left',clickCount:1});await send('Input.dispatchMouseEvent',{type:'mouseReleased',x,y,button:'left',clickCount:1});await sleep(850);};
          const type=async t=>{await send('Input.insertText',{text:t});await sleep(400);};
          const state=async label=>{const r=await send('Runtime.evaluate',{expression:`JSON.stringify({label:${JSON.stringify(label)},canvas:[...document.querySelectorAll('canvas')].map(c=>({w:c.width,h:c.height})),inputs:[...document.querySelectorAll('input')].map(i=>({type:i.type,value:i.value,display:getComputedStyle(i).display}))})`,returnByValue:true});fs.appendFileSync('screenshots/runtime-state.txt',(r.result?.value||'')+'\n');};

          // Open actual Login UI from LoginScene.
          await click(640,508); await sleep(2500); await shot('01-dang-nhap');

          const username=`preview${Date.now().toString().slice(-9)}`;
          const password='Preview2026!';
          await click(640,299); await type(username);
          await click(640,373); await type(password);
          await state('credentials-filled');
          // First outside click only blurs Cocos EditBox's HTML input. Second click reaches the Cocos Button.
          await click(640,570); await sleep(700); await click(640,570);
          await sleep(22000); await state('after-register-login'); await shot('debug-after-register');

          // Real new-account role creation.
          let create={x:638,y:529}; try{create=JSON.parse(fs.readFileSync('/tmp/create-screen.json','utf8'));}catch{}
          await click(create.x,create.y); await sleep(32000); await state('after-role-create');
          await shot('02-ban-do');

          // Real Map HUD menus.
          await click(75,164); await sleep(5500); await shot('03-tuong');
          await click(1190,50); await sleep(1800);
          await click(75,268); await sleep(5500); await shot('04-chieu-mo');
          await click(1190,50); await sleep(1800);
          await click(75,216); await sleep(5500); await shot('05-chien-bao');
          await state('finished');
          fs.writeFileSync('screenshots/browser-events.txt',events.slice(-800).join('\n'));
          ws.close();
          NODE

          node /tmp/runtime-capture.mjs 2>&1 | tee screenshots/capture.log
          cp /tmp/slg-chrome.log screenshots/chrome.log || true
          cp /tmp/create-coordinate.txt screenshots/create-coordinate.txt || true
          ls -lh screenshots

      - name: Upload real project screenshots
        uses: actions/upload-artifact@v4
        with:
          name: slgclient-real-runtime-screenshots-v2
          path: screenshots/
          if-no-files-found: error
          retention-days: 3
